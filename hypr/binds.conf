# https://wiki.hyprland.org/Configuring/Binds/ for more
# https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Launchers
bindrd = SUPER, Super_L, Launch menu, exec, $menu
bindd = $mainMod SHIFT, 1, Launch terminal, exec, $terminal
bindd = $mainMod SHIFT, 3, Launch file manager, exec, $fileManager
bindd = , Print, Launch screenshot, exec, $HOME/.config/hypr/screenshot.sh

# Window management
bindd = $mainMod, C, Close window, killactive, 
bindd = $mainMod, M, Logout, exit, 
bindd = $mainMod SHIFT, 5, Toggle floating window, togglefloating, 
bind = $mainMod SHIFT, 0, pseudo, # dwindle
bindd = $mainMod, EQUAL, Rearange splits, togglesplit, # dwindle
bindd = $mainMod, F, Toggle fullscreen, fullscreen, 0

# Move window focus with mainMod + arrow keys
bindd = $mainMod, h, Move left, movefocus, l
bindd = $mainMod, j, Move down, movefocus, d
bindd = $mainMod, k, Move up, movefocus, u
bindd = $mainMod, l, Move right, movefocus, r

# Move window
bindd = $mainMod SHIFT, h, Move window left, movewindow, l
bindd = $mainMod SHIFT, j, Move window down, movewindow, d
bindd = $mainMod SHIFT, k, Move window up, movewindow, u
bindd = $mainMod SHIFT, l, Move window right, movewindow, r

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, q, Switch to workspace 1, workspace, 1
bindd = $mainMod, w, Switch to workspace 2, workspace, 2
bindd = $mainMod, e, Switch to workspace 3, workspace, 3
bindd = $mainMod, r, Switch to workspace 4, workspace, 4
bindd = $mainMod, t, Switch to workspace 5, workspace, 5
bindd = $mainMod, y, Switch to workspace 6, workspace, 6
bindd = $mainMod, u, Switch to workspace 7, workspace, 7
bindd = $mainMod, i, Switch to workspace 8, workspace, 8
bindd = $mainMod, o, Switch to workspace 9, workspace, 9
bindd = $mainMod, p, Switch to workspace 10, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindd = $mainMod SHIFT, q, Move window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, w, Move window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, e, Move window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, r, Move window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, t, Move window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, y, Move window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, u, Move window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, i, Move window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, o, Move window to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, p, Move window to workspace 10, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Swap monitor
bindd = $mainMod, TAB, Swap monitors, swapactiveworkspaces, DP-2 HDMI-A-1
bindd = $mainMod CONTROL, h, Move workspace left, movecurrentworkspacetomonitor, l
bindd = $mainMod CONTROL, l, Move workspace right, movecurrentworkspacetomonitor, r

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia
bindeld = , XF86AudioRaiseVolume, Raise volume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Lower volume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld  = , XF86AudioPlay, Pause/resume media, exec, playerctl play-pause
bindld  = , XF86AudioPrev, Back/rewind media, exec, playerctl previous
bindld  = , XF86AudioNext, Next/skip media, exec, playerctl next
bindeld = , XF86AudioMute, Mute audio, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindeld = , XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = , XF86MonBrightnessUp, Raise brightness, exec, brightnessctl s 10%+
bindeld = , XF86MonBrightnessDown, Lower brightness, exec, brightnessctl s 10%-
